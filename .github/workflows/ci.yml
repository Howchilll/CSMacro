name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HowMacro.slnx -c Release

      - name: Test
        run: dotnet test tests/Demo.Macros.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack pack/HowMacro -c Release
          dotnet pack src/HowMacro.Testing -c Release

      # The Snake example consumes HowMacro through the package (its nuget.config points at artifacts/packages),
      # so this proves the freshly built package works end to end.
      - name: Smoke test with the Snake example
        run: |
          dotnet build examples/Snake
          dotnet examples/Snake/bin/Debug/net10.0/Snake.dll --demo

      # The Unity package can't be tested here (no Unity), but it must assemble
      - name: Assemble the Unity package
        run: python3 unity/pack_upm.py

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
