name: Publish

# Push a tag like v0.1.1-preview to publish HowMacro and HowMacro.Testing
# to nuget.org and GitHub Packages. The package version comes from the tag.
#
# nuget.org uses Trusted Publishing: no long-lived API key is stored anywhere. At run time the job
# exchanges its GitHub OIDC token for a short-lived nuget.org key (NuGet/login).
# One-time setup:
#   1. On nuget.org, add a Trusted Publishing policy: owner Howchilll, repository CSMacro,
#      workflow file publish.yml, no environment.
#   2. Add a repository secret named NUGET_USER (Settings > Secrets and variables > Actions)
#      holding your nuget.org user name (profile name, not email).
# GitHub Packages uses the built-in GITHUB_TOKEN.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write   # push to GitHub Packages
  id-token: write   # OIDC token for nuget.org Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      # Fail before building anything, so a release is never published to only one of the two feeds.
      - name: Check the nuget.org user name
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Add a repository secret named NUGET_USER with your nuget.org user name, then push the tag again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build HowMacro.slnx -c Release -p:HowMacroVersion=$VERSION

      - name: Test
        run: dotnet test tests/Demo.Macros.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack pack/HowMacro -c Release -p:HowMacroVersion=$VERSION
          dotnet pack src/HowMacro.Testing -c Release -p:HowMacroVersion=$VERSION

      - name: Smoke test with the Snake example
        run: |
          dotnet build examples/Snake -p:HowMacroVersion=$VERSION
          dotnet examples/Snake/bin/Debug/net10.0/Snake.dll --demo

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived nuget.org API key
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
